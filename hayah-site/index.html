<style>
:root{--bg:#0b0606;--pan:#160a0b;--red:#e5202e;--red2:#9c1520;--tx:#f5eded;--mut:#b99ea0;--line:#3a1417;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7;background-image:radial-gradient(900px 520px at 0% 25%,rgba(190,20,30,.30),transparent 60%),radial-gradient(700px 480px at 100% 0%,rgba(190,20,30,.22),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:8px 16px;margin:12px;border:1px solid var(--line);border-radius:12px;background:rgba(14,7,8,.94);backdrop-filter:blur(8px)}
.brand img{height:38px;display:block;mix-blend-mode:screen}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav a{padding:6px 14px;color:var(--mut);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
.nav a.on{color:var(--tx);border-color:var(--red);background:rgba(229,32,46,.14)}
.tools{display:flex;gap:8px;align-items:center}
.si{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;color:var(--red);background:#120708}
.si:hover{background:var(--red);color:#fff}
.dv{padding:6px 14px;border:1px solid var(--red);background:transparent;color:var(--tx);border-radius:8px}
.dv:hover,.dv.on{background:var(--red)}
main{max-width:1180px;margin:0 auto;padding:12px 18px 40px}
.btn{display:inline-block;padding:9px 26px;border:1px solid var(--red);text-decoration:none;background:rgba(229,32,46,.08);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.btn:hover{background:var(--red)}
.tag{text-align:center;margin-top:20px;font-size:1.25rem;font-weight:800}
h2{font-size:2rem;font-weight:900;margin:12px 0 18px;border-inline-start:5px solid var(--red);padding-inline-start:12px}
.mut{color:var(--mut)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--pan);border:1px solid var(--line);border-top:3px solid var(--red);padding:14px}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:1.2rem}
.fig{position:relative;margin:0}.fig img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border:1px solid var(--line)}
.fig button{position:absolute;top:8px;inset-inline-start:8px}
.about{max-width:70ch;font-size:1.1rem}
.dev{display:flex;align-items:center;gap:14px;justify-content:center;padding:22px 12px 30px;border-top:1px solid var(--line);color:var(--mut)}
.av{width:64px;height:64px;border-radius:50%;border:2px solid var(--red);overflow:hidden;display:grid;place-items:center;font-size:.7rem;background:#120708}
.av img{width:100%;height:100%;object-fit:cover}
.b{padding:6px 14px;background:#241012;color:var(--tx);border:1px solid var(--line);border-radius:6px}
.b:hover{border-color:var(--red)}.b.p{background:var(--red);border-color:var(--red)}.b.d{color:#ff8a92}
.ed{white-space:pre-wrap}
.ed[contenteditable]{outline:1px dashed var(--red);outline-offset:3px;min-width:2ch;display:inline-block}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:25;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#1c0b0d;border-top:1px solid var(--red)}
.e{padding-bottom:110px}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.75)}
.box{background:var(--pan);border:1px solid var(--red);padding:22px;width:min(340px,90vw);text-align:center}
.box input{width:100%;padding:10px;margin:8px 0;background:#0b0606;color:var(--tx);border:1px solid var(--line);text-align:center;font-size:1.2rem;letter-spacing:.3em}
.box p{color:#ff8a92;min-height:1.5em;margin:0}
.hero{position:relative;overflow:hidden;min-height:78vh;display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:#090404;isolation:isolate}
.hero>.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 30%;z-index:-3;filter:grayscale(.55) contrast(1.1) brightness(.85)}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(to left,rgba(9,3,4,.97) 0%,rgba(9,3,4,.84) 36%,rgba(120,10,18,.38) 68%,rgba(9,3,4,.25) 100%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;z-index:-1;background:linear-gradient(to top,#090404,transparent)}
.hero .sl{position:absolute;top:0;left:0;width:190px;height:80px;background:repeating-linear-gradient(115deg,var(--red) 0 10px,transparent 10px 22px);opacity:.5;clip-path:polygon(0 0,100% 0,0 100%);z-index:-1}
.hc{padding:44px 5% 90px;max-width:640px}
.hc .lg{width:min(400px,82%);display:block;mix-blend-mode:screen}
.slogan{font-size:clamp(1.8rem,4.4vw,3rem);font-weight:900;line-height:1.25;margin:8px 0 6px}
.sub{font-size:1.2rem;color:#e6d4d5;margin:0;border-inline-start:3px solid var(--red);padding-inline-start:12px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn.fill{background:var(--red)}.btn.fill:hover{background:#ff3140}
.hc>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.hc>:nth-child(2){animation-delay:.12s}.hc>:nth-child(3){animation-delay:.22s}.hc>:nth-child(4){animation-delay:.32s}
.e .hc>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media(prefers-reduced-motion:reduce){.hc>*{animation:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:-48px 18px 0;position:relative;z-index:2}
.stat{display:flex;align-items:center;gap:14px;justify-content:center;padding:16px 10px;background:rgba(18,8,9,.94);border:1px solid var(--line);border-bottom:2px solid var(--red);border-radius:10px}
.stat svg{color:var(--red);flex:none}.stat b{display:block;font-size:1.8rem;font-weight:900;line-height:1.1}.stat span{color:var(--mut)}
.mb{display:none;width:38px;height:38px;border:1px solid var(--line);background:#120708;color:var(--tx);border-radius:8px;font-size:1.2rem}
.nav{justify-content:center}.nav a{font-size:1.02rem;font-weight:600;padding:8px 16px}.nav a.adm{color:#ffb3b8}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:760px;margin-top:16px;padding:20px;background:var(--pan);border:1px solid var(--line);border-top:3px solid var(--red)}
.form label{display:grid;gap:6px;font-weight:600}.form .w{grid-column:1/-1}
.form input,.form select{padding:10px 12px;background:#0b0606;color:var(--tx);border:1px solid var(--line);border-radius:6px;font:inherit}
.form input:focus,.form select:focus{border-color:var(--red)}
.seg{display:flex;gap:10px}.seg label{flex:1;display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px;font-weight:400;cursor:pointer}
.seg input{accent-color:var(--red);width:auto}
.fm{min-height:1.6em;margin:0}.fm.ok{color:#7fe3a0}.fm.er{color:#ff8a92}
.box.lk{text-align:start}.box.lk label{display:grid;gap:4px;margin:8px 0;color:var(--mut)}.box.lk input{letter-spacing:0;text-align:left;font-size:1rem;margin:0}
@media(max-width:760px){.mb{display:block}.tools{margin-inline-start:auto}.top{flex-wrap:wrap}.nav{display:none;order:4;flex-basis:100%;flex-direction:column;padding:4px 0}.nav.open{display:flex}.nav a{padding:12px 14px;border-bottom:1px solid var(--line)}h2{font-size:1.5rem}.hero{min-height:72vh}.hc{padding-bottom:80px}.stats{grid-template-columns:1fr;margin:-34px 12px 0}.form{grid-template-columns:1fr}}
</style>
</head>

achievements:()=>`<div class="row2"><h2>${T('ach_h','إنجازات الأسرة')}</h2>${addBtn('add-ach','+ إضافة إنجاز')}</div>${cards('ach',S.ach,true,'لسه ما اتضافتش إنجازات. قريبًا.')}`,
gallery:()=>`<div class="row2"><h2>${T('gal_h','معرض الصور')}</h2>${addBtn('add-gal','+ إضافة صور')}</div>${S.gal.length?`<div class="grid">${S.gal.map(g=>`<figure class="fig"><img src="${esc(g.img)}" alt="" loading="lazy">${E?`<button class="b d" data-act="del" data-l="gal" data-i="${g.id}">حذف</button>`:''}</figure>`).join('')}</div>`:`<p class="mut">${E?'لسه فاضي. استخدم زر الإضافة.':'لسه ما اتضافتش صور. قريبًا.'}</p>`}`,
join:()=>`<h2>${T('join_h','التقديم للفريق')}</h2><div class="about">${body('join_b','املا البيانات دي وهنتواصل معاك.')}</div>
<form id="jf" class="form" novalidate><label>الاسم<input name="name" autocomplete="name" required></label><label>من أين؟ (المحافظة أو المدينة)<input name="city" required></label><label>القسم<input name="dept" required></label><label>السنة الدراسية<select name="year"><option>الفرقة الأولى</option><option>الفرقة الثانية</option><option>الفرقة الثالثة</option><option>الفرقة الرابعة</option><option>أخرى</option></select></label><div class="w"><span style="font-weight:600">الحالة</span><div class="seg"><label><input type="radio" name="status" value="مستجد">مستجد</label><label><input type="radio" name="status" value="باقي">باقي</label></div></div><label class="w">رقم الجوال<input name="phone" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" required></label><div class="w"><button class="btn fill" type="submit" style="border-width:1px;color:var(--tx);font:inherit;cursor:pointer">إرسال الطلب</button></div><p class="fm w" role="status"></p></form>`,
news:()=>`<div class="row2"><h2>${T('news_h','الأخبار')}</h2>${addBtn('add-news','+ إضافة خبر')}</div>${cards('news',S.news,false,'لسه مفيش أخبار. قريبًا.')}`
,applications:()=>`<div class="row2"><h2>طلبات التقديم</h2><span class="mut">${APPS.length} طلب</span></div>`+(APPS.length?`<div class="grid">${APPS.map(a=>`<article class="card"><h3>${esc(a.name||'')}</h3><p>${esc(a.city||'')} — ${esc(a.dept||'')}<br>${esc(a.year||'')} · ${esc(a.status||'')}<br><a href="tel:${esc(a.phone||'')}" dir="ltr">${esc(a.phone||'')}</a></p><small class="mut">${a.at?new Date(a.at).toLocaleString('ar-EG'):''}</small><div class="row2" style="margin-top:8px"><a class="b" href="https://wa.me/${waNum(a.phone)}" target="_blank" rel="noopener">واتساب</a><button class="b d" data-act="del-app" data-i="${esc(a.id)}">حذف</button></div></article>`).join('')}</div>`:`<p class="mut">${appsErr||'مفيش طلبات لسه.'}</p>`)
};
function render(){
const v=cur();
$('#app').className=E?'e':'';
$('#app').innerHTML=`<header class="top"><a class="brand" href="#home"><img src="${S.img.logo}" alt="حياة تيم"></a><nav class="nav${menuOpen?' open':''}">${vs().map(x=>`<a href="#${x[0]}" class="${x[0]===v?'on':''}${x[0]==='applications'?' adm':''}">${x[1]}</a>`).join('')}</nav><div class="tools">${soc('fb','فيس بوك')}${soc('tt','تيك توك')}<button class="dv ${E?'on':''}" data-act="dev">المطور</button><button class="mb" data-act="menu" aria-label="القائمة" aria-expanded="${menuOpen}">☰</button></div></header>
<main>${V[v]()}</main>
<footer class="dev"><div class="av" ${E?'data-act="pic" data-set="dev" title="غيّر الصورة" style="cursor:pointer"':''}>${S.img.dev?`<img src="${esc(S.img.dev)}" alt="">`:'<span>صورة المطور</span>'}</div><div><small>مطور الموقع</small><br><b>${T('devname','اسم المطور')}</b></div></footer>
${E?`<div class="bar"><b>وضع التحكم</b><button class="b p" data-act="save">تنزيل النسخة المعدّلة</button><button class="b" data-act="pic" data-set="logo">تغيير الشعار</button><button class="b" data-act="pic" data-set="hero">تغيير الصورة الرئيسية</button><button class="b" data-act="links">الروابط</button><button class="b" data-act="exit">خروج</button><span id="msg" class="mut"></span></div>`:''}`;
}
const msg=t=>{const m=$('#msg');if(m)m.textContent=t};
const pick=cb=>{const f=$('#fi');f.multiple=false;f.onchange=async()=>{const fs=[...f.files];f.value='';if(fs.length)await cb(fs)};f.click()};
async function shrink(f,max=1400){const u=URL.createObjectURL(f);const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u});const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);return c.toDataURL('image/jpeg',.82)}
async function upImg(f){return shrink(f)}
function ask(){$('#ui').innerHTML='<div class="modal"><div class="box"><h3>دخول المطور</h3><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز السري"><p id="er"></p><div><button class="b p" data-act="login">دخول</button> <button class="b" data-act="close">إلغاء</button></div></div></div>';const p=$('#pw');p.focus();p.onkeydown=e=>{if(e.key==='Enter')login()}}
function login(){if($('#pw').value===CODE){E=true;try{sessionStorage.setItem('hy','1')}catch(_){}$('#ui').innerHTML='';render()}else $('#er').textContent='الرمز غير صحيح'}
function save(){
const c=document.documentElement.cloneNode(true);
c.querySelector('#app').innerHTML=FB;c.querySelector('#ui').innerHTML='';
c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
const b=new Blob(['<!doctype html>\n'+c.outerHTML],{type:'text/html'});
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';document.body.appendChild(a);a.click();a.remove();
dirty=false;msg('اتحمّل ملف index.html. ارفعه على الاستضافة مكان القديم.')}
document.addEventListener('click',async e=>{
const b=e.target.closest('[data-act]');const a=b&&b.dataset.act;if(!a)return;
if(a==='links'||a==='dev'||a==='del'||a==='pic'||a==='save'||a==='exit')e.preventDefault();
const d=b.dataset;
if(a==='dev'){E?(msg('أنت داخل بالفعل')):ask()}
else if(a==='login')login();
else if(a==='close')$('#ui').innerHTML='';
else if(a==='exit'){if(dirty&&!await sure('فيه تعديلات ماتحفظتش. تخرج برضه؟'))return;E=false;try{sessionStorage.removeItem('hy')}catch(_){}if(unsub){unsub();unsub=null}if(cur()==='applications')location.hash='home';render()}
else if(a==='save')save();
else if(a==='add-ach'){S.ach.unshift({id:uid(),title:'عنوان الإنجاز',text:'تفاصيل الإنجاز',img:''});dirty=true;render()}
else if(a==='add-news'){S.news.unshift({id:uid(),title:'عنوان الخبر',text:'تفاصيل الخبر',img:''});dirty=true;render()}
else if(a==='add-gal'){const f=$('#fi');f.multiple=true;f.onchange=async()=>{const fs=[...f.files];f.value='';msg('جاري رفع الصور...');for(const x of fs)S.gal.push({id:uid(),img:await upImg(x)});dirty=true;render()};f.click()}
else if(a==='del'){if(!await sure('متأكد من الحذف؟'))return;S[d.l]=S[d.l].filter(x=>x.id!==d.i);dirty=true;render()}
else if(a==='pic')pick(async fs=>{const u=await upImg(fs[0]);if(d.set)S.img[d.set]=u;else{const it=S[d.l].find(x=>x.id===d.i);if(it)it.img=u}dirty=true;render()});
else if(a==='links')linksBox();
else if(a==='links-ok'){const u=v=>{v=v.trim();return v&&!/^https?:\/\//i.test(v)?'https://'+v:v};S.social.fb=u($('#l1').value);S.social.tt=u($('#l2').value);S.wa=waNum($('#l3').value);S.fs=$('#l4').value.trim();dirty=true;$('#ui').innerHTML='';render()}
else if(a==='menu'){menuOpen=!menuOpen;render()}
else if(a==='del-app'){if(!await sure('تحذف الطلب ده؟'))return;try{const db=await claude.use('db');await db.doc('applications/'+d.i).delete()}catch(_){appsErr='ماقدرتش أحذف الطلب';render()}}
});
document.addEventListener('focusout',e=>{const el=e.target;if(!E||!el.classList||!el.classList.contains('ed'))return;const v=el.innerText.replace(/\n+$/,'');
if(el.dataset.k)S.t[el.dataset.k]=v;else if(el.dataset.l){const it=S[el.dataset.l].find(x=>x.id===el.dataset.i);if(it)it[el.dataset.f]=v}
dirty=true;msg('فيه تعديلات لسه ماتحفظتش')});

const sure=m=>new Promise(r=>{$('#ui').innerHTML=`<div class="modal"><div class="box"><p style="color:var(--tx)">${esc(m)}</p><div><button class="b p" id="y">تأكيد</button> <button class="b" id="n">إلغاء</button></div></div></div>`;$('#y').onclick=()=>{$('#ui').innerHTML='';r(true)};$('#n').onclick=()=>{$('#ui').innerHTML='';r(false)}});
function linksBox(){$('#ui').innerHTML=`<div class="modal"><div class="box lk"><h3>الروابط</h3><label>رابط صفحة فيس بوك<input id="l1" dir="ltr" value="${esc(S.social.fb)}" placeholder="https://facebook.com/..."></label><label>رابط حساب تيك توك<input id="l2" dir="ltr" value="${esc(S.social.tt)}" placeholder="https://tiktok.com/@..."></label><label>رقم واتساب لاستقبال طلبات التقديم<input id="l3" dir="ltr" inputmode="tel" value="${esc(S.wa||'')}" placeholder="01XXXXXXXXX"></label><label>رابط Formspree لاستقبال الطلبات على الإيميل (اختياري)<input id="l4" dir="ltr" value="${esc(S.fs||'')}" placeholder="https://formspree.io/f/..."></label><div style="margin-top:12px"><button class="b p" data-act="links-ok">حفظ</button> <button class="b" data-act="close">إلغاء</button></div></div></div>`}
async function startApps(){}
async function sendApp(r){
if(S.fs){try{const x=await fetch(S.fs,{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify(r)});if(x.ok)return{k:'db'}}catch(_){}}
if(S.wa){const t='طلب تقديم لفريق حياة\nالاسم: '+r.name+'\nمن: '+r.city+'\nالقسم: '+r.dept+'\nالسنة: '+r.year+'\nالحالة: '+r.status+'\nالجوال: '+r.phone;return{k:'wa',url:'https://wa.me/'+S.wa+'?text='+encodeURIComponent(t)}}
return{k:''}}
document.addEventListener('submit',async e=>{
if(e.target.id!=='jf')return;e.preventDefault();
const f=e.target,fd=Object.fromEntries(new FormData(f)),m=f.querySelector('.fm');
const ph=String(fd.phone||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s\-+]/g,'');
if(!(fd.name||'').trim()||!(fd.city||'').trim()||!(fd.dept||'').trim()||!fd.status||!/^\d{10,15}$/.test(ph)){m.className='fm w er';m.textContent='راجع البيانات: كل الخانات مطلوبة ورقم الجوال لازم يكون صحيح.';return}
m.className='fm w';m.textContent='جاري الإرسال...';
const r=await sendApp({name:fd.name.trim(),city:fd.city.trim(),dept:fd.dept.trim(),year:fd.year,status:fd.status,phone:ph,at:Date.now()});
if(r.k==='db'){m.className='fm w ok';m.textContent='تم إرسال طلبك. هنتواصل معاك قريب.';f.reset()}
else if(r.k==='wa'){m.className='fm w ok';m.innerHTML='اضغط الزر علشان يوصلنا طلبك على واتساب: <a class="btn fill" href="'+esc(r.url)+'" target="_blank" rel="noopener">إرسال عبر واتساب</a>'}
else{m.className='fm w er';m.textContent='التقديم مش متاح دلوقتي. تواصل معانا على صفحاتنا.'}});
window.addEventListener('hashchange',()=>{menuOpen=false;render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
